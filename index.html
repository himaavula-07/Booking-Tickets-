<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieBook - Ticket Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎬 MovieBook</h1>
  <p>Book your movie tickets</p>
</header>

<main>
  <section id="movies">
    <h2>Now Showing</h2>
    <div class="movie-grid">
      <div class="movie-card">
        <div class="poster">🎬</div>
        <h3>Adventure Night</h3>
        <p>English • 2D</p>
        <button onclick="selectMovie('Adventure Night')">Book Now</button>
      </div>
      <div class="movie-card">
        <div class="poster">🍿</div>
        <h3>Love Story</h3>
        <p>Telugu • 2D</p>
        <button onclick="selectMovie('Love Story')">Book Now</button>
      </div>
      <div class="movie-card">
        <div class="poster">⭐</div>
        <h3>Super Hero</h3>
        <p>Hindi • 3D</p>
        <button onclick="selectMovie('Super Hero')">Book Now</button>
      </div>
    </div>
  </section>

  <section id="booking" class="hidden">
    <h2 id="selectedMovie">Booking</h2>

    <label for="show">Select Show Time:</label>
    <select id="show">
      <option>10:00 AM</option>
      <option>1:30 PM</option>
      <option>5:00 PM</option>
      <option>8:30 PM</option>
    </select>

    <h3>Select Seats</h3>
    <div class="screen">SCREEN</div>
    <div id="seats" class="seat-grid"></div>

    <div class="summary">
      <p>Selected Seats: <span id="seatList">None</span></p>
      <p>Total: ₹<span id="total">0</span></p>
      <button onclick="confirmBooking()">Confirm Booking</button>
      <button class="secondary" onclick="goBack()">Back</button>
    </div>
  </section>
</main>

<div id="successModal" class="modal hidden">
  <div class="modal-content">
    <h2>🎉 Booking Successful!</h2>
    <p id="ticketInfo"></p>
    <button onclick="closeSuccessWindow()">Close Window</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
